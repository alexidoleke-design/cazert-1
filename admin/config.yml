# Configuration Decap CMS — Cazert_Studio
# Documentation : https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main
  # ⚠️ Nécessite d'activer "Identity" + "Git Gateway" dans le dashboard Netlify
  # (Site settings → Identity → Enable Identity, puis Services → Git Gateway → Enable)

media_folder: "uploads"
public_folder: "/uploads"

locale: "fr"

collections:

  # ─────────────────────────────────────────────
  # PORTFOLIO — édite content/portfolio.json
  # Sur la page portfolio.html, chaque catégorie alimente 2 sections distinctes :
  #   1. "Nos réalisations" → Titre + Description courte + Vidéos
  #   2. "Nos services"     → Titre + Texte détaillé + FAQ (affichés en entier, sans bouton "en savoir plus")
  # ─────────────────────────────────────────────
  - name: "portfolio"
    label: "Portfolio"
    files:
      - file: "content/portfolio.json"
        label: "Catégories du portfolio"
        name: "portfolio"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{titre}} ({{fields.videos}} vidéos)"
            hint: "Chaque catégorie apparaît automatiquement dans 2 sections de la page Portfolio : « Nos réalisations » (titre, description courte, vidéos) et « Nos services » (titre, texte détaillé, FAQ)."
            fields:
              - {label: "Titre du service", name: "titre", widget: "string", hint: "Affiché dans « Nos réalisations » ET comme titre dans « Nos services »."}
              - {label: "Description courte", name: "description", widget: "string", required: false, hint: "Affichée sous le titre, dans la section « Nos réalisations » uniquement."}
              - {label: "Texte détaillé du service (Markdown : ## pour les sous-titres, - pour les listes, **gras**)", name: "seoText", widget: "markdown", required: false, hint: "Affiché intégralement (texte complet, pas de repli) dans la section « Nos services », en bas de la page Portfolio."}
              - label: "Questions fréquentes de ce service"
                name: "faq"
                widget: "list"
                required: false
                hint: "Affichées intégralement dans la section « Nos services »."
                fields:
                  - {label: "Question", name: "question", widget: "string"}
                  - {label: "Réponse", name: "reponse", widget: "text"}
              - label: "Vidéos (liens YouTube complets ou Shorts)"
                name: "videos"
                widget: "list"
                allow_add: true

  # ─────────────────────────────────────────────
  # FORMATIONS — édite content/formations.json
  # ─────────────────────────────────────────────
  - name: "formations"
    label: "Formations"
    files:
      - file: "content/formations.json"
        label: "Liste des formations"
        name: "formations"
        fields:
          - label: "Formations"
            name: "formations"
            widget: "list"
            summary: "{{titre}} — {{statut}}"
            fields:
              - label: "Statut"
                name: "statut"
                widget: "select"
                options:
                  - {label: "Publiée (visible et achetable)", value: "publie"}
                  - {label: "Bientôt disponible", value: "bientot"}
                  - {label: "Masquée (non visible sur le site)", value: "masque"}
              - {label: "Image de couverture", name: "image", widget: "image"}
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Badge (ex: Nouveau, Bestseller)", name: "badge", widget: "string", required: false}
              - {label: "Sous-titre", name: "sousTitre", widget: "string"}
              - {label: "Description courte", name: "descriptionCourte", widget: "text"}
              - {label: "Durée", name: "duree", widget: "string"}
              - {label: "Nombre de modules", name: "modules", widget: "number", value_type: "int"}
              - {label: "Prix (FCFA)", name: "prix", widget: "number", value_type: "int"}
              - {label: "Ancien prix (FCFA, optionnel)", name: "ancienPrix", widget: "number", value_type: "int", required: false}
              - {label: "Lien de paiement", name: "lienPaiement", widget: "string"}

  # ─────────────────────────────────────────────
  # RESSOURCES — édite content/ressources.json
  # ─────────────────────────────────────────────
  - name: "ressources"
    label: "Ressources"
    files:
      - file: "content/ressources.json"
        label: "Liste des ressources"
        name: "ressources"
        fields:
          - label: "Ressources"
            name: "ressources"
            widget: "list"
            summary: "{{titre}} — {{statut}}"
            fields:
              - label: "Statut"
                name: "statut"
                widget: "select"
                options:
                  - {label: "Publiée (visible et achetable)", value: "publie"}
                  - {label: "Bientôt disponible", value: "bientot"}
                  - {label: "Masquée (non visible sur le site)", value: "masque"}
              - {label: "Image de couverture", name: "image", widget: "image"}
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Badge (ex: Nouveau, Bestseller)", name: "badge", widget: "string", required: false}
              - {label: "Sous-titre", name: "sousTitre", widget: "string"}
              - {label: "Description courte", name: "descriptionCourte", widget: "text"}
              - {label: "Type de ressource (ex: Pack LUTs, Preset, Template)", name: "type", widget: "string"}
              - {label: "Prix (FCFA)", name: "prix", widget: "number", value_type: "int"}
              - {label: "Ancien prix (FCFA, optionnel)", name: "ancienPrix", widget: "number", value_type: "int", required: false}
              - {label: "Lien de paiement (Chariow)", name: "lienPaiement", widget: "string"}

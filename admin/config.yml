# Configuration Decap CMS — Cazert_Studio
# Documentation : https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main
  # ⚠️ Nécessite d'activer "Identity" + "Git Gateway" dans le dashboard Netlify
  # (Site settings → Identity → Enable Identity, puis Services → Git Gateway → Enable)

# Identité visuelle de l'espace admin
logo_url: "/uploads/logo-cazert.png"
site_url: "https://cazertstudio.com"
display_url: "https://cazertstudio.com"

media_folder: "uploads"
public_folder: "/uploads"

locale: "fr"

collections:

  # ══════════════════════════════════════════════════════════════
  # 🏠  PAGE D'ACCUEIL
  # Les 2 collections ci-dessous éditent les 2 sections principales
  # de la page d'accueil (cazertstudio.com), dans l'ordre où elles
  # apparaissent sur la page : d'abord "Nos réalisations", puis
  # "Nos services".
  # ══════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────
  # 🎬 RÉALISATIONS (vidéos) — édite content/portfolio.json
  # Alimente directement la section "Nos réalisations" de la page
  # d'accueil : chaque catégorie y affiche son titre, sa description
  # courte et un aperçu de 3 vidéos.
  # Le champ "Texte détaillé" et la liste complète des vidéos sont
  # utilisés dans la fenêtre qui s'ouvre depuis le bouton
  # "Voir des exemples" de la section "Nos services".
  # ─────────────────────────────────────────────
  - name: "portfolio"
    label: "🎬 Réalisations (accueil)"
    files:
      - file: "content/portfolio.json"
        label: "Vidéos de réalisations"
        name: "portfolio"
        fields:
          - label: "Catégories de réalisations"
            name: "categories"
            widget: "list"
            summary: "{{titre}} ({{fields.videos}} vidéos)"
            hint: "Chaque catégorie devient un bloc dans « Nos réalisations » sur l'accueil, ET un service détaillé dans « Nos services »."
            fields:
              - label: "Titre du service"
                name: "titre"
                widget: "string"
                hint: "Affiché comme titre dans « Nos réalisations » ET dans « Nos services »."
              - label: "Description courte"
                name: "description"
                widget: "string"
                required: false
                hint: "Affichée sous le titre, dans « Nos réalisations » sur l'accueil, uniquement."
              - label: "Vidéos de réalisations (liens YouTube ou Shorts)"
                name: "videos"
                widget: "list"
                allow_add: true
                hint: "📌 Les 3 premières vidéos de cette liste s'affichent directement sur la page d'accueil, dans « Nos réalisations ». La liste complète (avec les suivantes) apparaît dans la fenêtre « Voir des exemples » de la section « Nos services ». Collez un lien YouTube complet ou un lien Shorts par ligne."
              - label: "Texte détaillé du service"
                name: "seoText"
                widget: "markdown"
                required: false
                hint: "Affiché dans la fenêtre « Nos services » (bouton « Voir des exemples »). Tout va dans ce même champ : présentation, FAQ, tarifs. Utilisez ## pour un sous-titre (ex: ## Questions fréquentes) et **texte en gras** pour un point important."

  # ─────────────────────────────────────────────
  # 🧩 NOS SERVICES (cartes) — édite content/services.json
  # Alimente la section "Nos services" de la page d'accueil : les
  # cartes avec icône, badge, description, prix et bouton
  # "Voir des exemples".
  # ⚠️ Le champ "Catégorie liée (Réalisations)" doit correspondre
  # EXACTEMENT (même orthographe) au "Titre du service" d'une
  # catégorie dans la collection "🎬 Réalisations" ci-dessus —
  # c'est ce qui permet au bouton "Voir des exemples" d'ouvrir la
  # bonne fenêtre avec les bonnes vidéos.
  # ─────────────────────────────────────────────
  - name: "services"
    label: "🧩 Nos services (accueil)"
    files:
      - file: "content/services.json"
        label: "Section Nos services"
        name: "services"
        fields:
          - {label: "Titre de la section", name: "titreSection", widget: "string"}
          - {label: "Texte d'introduction", name: "introSection", widget: "text"}
          - label: "Cartes de service"
            name: "cartes"
            widget: "list"
            summary: "{{titre}}"
            fields:
              - label: "Icône"
                name: "icone"
                widget: "select"
                options:
                  - {label: "Vidéo / YouTube (caméra)", value: "youtube"}
                  - {label: "Short-form (téléphone vertical)", value: "shortform"}
                  - {label: "Publicité ADS (cible)", value: "ads"}
                  - {label: "Motion Design (étoile)", value: "motion"}
                  - {label: "Interview (micro)", value: "interview"}
                  - {label: "VSL (courbe de croissance)", value: "vsl"}
                  - {label: "Logo animé (orbite)", value: "logo"}
              - {label: "Titre de la carte", name: "titre", widget: "string"}
              - {label: "Badge (ex: + Rétention)", name: "badge", widget: "string", required: false}
              - {label: "Description courte", name: "description", widget: "text"}
              - {label: "Ligne prix / info", name: "prix", widget: "string", required: false, hint: "Ex : « Sur devis, adapté à votre projet »"}
              - label: "Catégorie liée (Réalisations)"
                name: "categoriePortfolio"
                widget: "string"
                hint: "Doit correspondre EXACTEMENT au « Titre du service » utilisé dans la collection « 🎬 Réalisations » ci-dessus, sinon le bouton « Voir des exemples » n'ouvrira aucune vidéo."
              - {label: "Mettre en avant cette carte ?", name: "populaire", widget: "boolean", default: false}
              - {label: "Texte du bandeau (si mise en avant)", name: "ribbon", widget: "string", required: false, hint: "Ex : « LE + DEMANDÉ ». Laisser vide si « Mise en avant » n'est pas coché."}

  # ══════════════════════════════════════════════════════════════
  # 🏷️  CATÉGORIES — Produits & Formations (une seule liste partagée :
  #     créez, modifiez ou supprimez vos catégories ici, avec un logo,
  #     puis choisissez-les sur chaque produit ou formation ci-dessous)
  # ══════════════════════════════════════════════════════════════
  - name: "categories"
    label: "🏷️ Catégories"
    files:
      - file: "content/categories.json"
        label: "Liste des catégories (Produits & Formations)"
        name: "categories"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{nom}}"
            fields:
              - {label: "Identifiant unique", name: "id", widget: "string", hint: "Sans espace ni accent, ex : « premiere-pro ». Ne pas modifier une fois créé, sinon les produits/formations qui l'utilisent perdront leur catégorie."}
              - {label: "Nom affiché", name: "nom", widget: "string", hint: "Ex : « Produits pour Adobe Première Pro »"}
              - {label: "Logo de la catégorie", name: "logo", widget: "image", required: false, hint: "Petite icône carrée affichée à côté du nom. Optionnel."}

  # ══════════════════════════════════════════════════════════════
  # 🎓  ONGLET "NOS FORMATIONS" — sur cazertstudio.com/ressources.html#formations
  # ══════════════════════════════════════════════════════════════
  - name: "formations"
    label: "🎓 Formations"
    files:
      - file: "content/formations.json"
        label: "Liste des formations"
        name: "formations"
        fields:
          - label: "Formations"
            name: "formations"
            widget: "list"
            summary: "{{titre}} — {{statut}}"
            fields:
              - label: "Statut"
                name: "statut"
                widget: "select"
                options:
                  - {label: "✅ Publiée (visible et achetable)", value: "publie"}
                  - {label: "🕒 Bientôt disponible", value: "bientot"}
                  - {label: "🚫 Masquée (non visible sur le site)", value: "masque"}
              - label: "Catégorie"
                name: "categorieId"
                widget: "relation"
                collection: "categories"
                file: "categories"
                value_field: "categories.*.id"
                search_fields: ["categories.*.nom"]
                display_fields: ["categories.*.nom"]
                required: false
                hint: "Créez d'abord vos catégories dans « 🏷️ Catégories » ci-dessus si elles n'existent pas encore."
              - {label: "Image de couverture", name: "image", widget: "image"}
              - {label: "Titre", name: "titre", widget: "string"}
              - label: "Badge"
                name: "badge"
                widget: "select"
                required: false
                options:
                  - {label: "Aucun", value: ""}
                  - {label: "🆕 Nouveau", value: "Nouveau"}
                  - {label: "🔥 Bestseller", value: "Bestseller"}
                  - {label: "💥 Promo", value: "Promo"}
                  - {label: "⏳ Édition limitée", value: "Édition limitée"}
                  - {label: "👍 Recommandé", value: "Recommandé"}
                hint: "Choisir « 💥 Promo » ouvre automatiquement cette fiche en popup dès l'arrivée sur la page."
              - label: "Description courte"
                name: "descriptionCourte"
                widget: "text"
                hint: "C'est le seul texte visible sur la carte AVANT qu'on clique dessus (avec le titre, le prix, la miniature et le bouton). Restez court."
              - label: "Sous-titre"
                name: "sousTitre"
                widget: "string"
                hint: "Affiché seulement quand la carte est dépliée (clic dessus)."
              - {label: "Durée", name: "duree", widget: "string", hint: "Ex : « 6h de contenu ». Affiché seulement carte dépliée."}
              - {label: "Nombre de modules", name: "modules", widget: "number", value_type: "int", hint: "Affiché seulement carte dépliée."}
              - label: "Description complète"
                name: "descriptionLongue"
                widget: "text"
                required: false
                hint: "Texte affiché seulement quand on clique sur la carte pour la déplier."
              - label: "Points forts"
                name: "pointsForts"
                widget: "list"
                required: false
                field: {label: "Point", name: "point", widget: "string"}
                hint: "Liste à puces affichée seulement carte dépliée (ex : ce qui est inclus)."
              - {label: "Prix (FCFA)", name: "prix", widget: "number", value_type: "int"}
              - {label: "Ancien prix (FCFA, optionnel)", name: "ancienPrix", widget: "number", value_type: "int", required: false}
              - {label: "Lien de paiement", name: "lienPaiement", widget: "string"}

  # ══════════════════════════════════════════════════════════════
  # 📦  ONGLET "NOS PRODUITS" — sur cazertstudio.com/ressources.html#produits
  # ══════════════════════════════════════════════════════════════
  - name: "ressources"
    label: "📦 Ressources"
    files:
      - file: "content/ressources.json"
        label: "Liste des ressources"
        name: "ressources"
        fields:
          - label: "Ressources"
            name: "ressources"
            widget: "list"
            summary: "{{titre}} — {{statut}}"
            fields:
              - label: "Statut"
                name: "statut"
                widget: "select"
                options:
                  - {label: "✅ Publiée (visible et achetable)", value: "publie"}
                  - {label: "🕒 Bientôt disponible", value: "bientot"}
                  - {label: "🚫 Masquée (non visible sur le site)", value: "masque"}
              - label: "Catégorie"
                name: "categorieId"
                widget: "relation"
                collection: "categories"
                file: "categories"
                value_field: "categories.*.id"
                search_fields: ["categories.*.nom"]
                display_fields: ["categories.*.nom"]
                required: false
                hint: "Créez d'abord vos catégories dans « 🏷️ Catégories » ci-dessus si elles n'existent pas encore."
              - {label: "Image de couverture", name: "image", widget: "image"}
              - {label: "Titre", name: "titre", widget: "string"}
              - label: "Badge"
                name: "badge"
                widget: "select"
                required: false
                options:
                  - {label: "Aucun", value: ""}
                  - {label: "🆕 Nouveau", value: "Nouveau"}
                  - {label: "🔥 Bestseller", value: "Bestseller"}
                  - {label: "💥 Promo", value: "Promo"}
                  - {label: "⏳ Édition limitée", value: "Édition limitée"}
                  - {label: "👍 Recommandé", value: "Recommandé"}
                hint: "Choisir « 💥 Promo » ouvre automatiquement cette fiche en popup dès l'arrivée sur la page."
              - label: "Description courte"
                name: "descriptionCourte"
                widget: "text"
                hint: "C'est le seul texte visible sur la carte AVANT qu'on clique dessus (avec le titre, le prix, la miniature et le bouton). Restez court."
              - label: "Sous-titre"
                name: "sousTitre"
                widget: "string"
                hint: "Affiché seulement quand la carte est dépliée (clic dessus)."
              - {label: "Type de ressource (ex: Pack LUTs, Preset, Template)", name: "type", widget: "string", hint: "Affiché seulement carte dépliée."}
              - label: "Description complète"
                name: "descriptionLongue"
                widget: "text"
                required: false
                hint: "Texte affiché seulement quand on clique sur la carte pour la déplier."
              - label: "Points forts"
                name: "pointsForts"
                widget: "list"
                required: false
                field: {label: "Point", name: "point", widget: "string"}
                hint: "Liste à puces affichée seulement carte dépliée (ex : ce qui est inclus)."
              - {label: "Prix (FCFA)", name: "prix", widget: "number", value_type: "int"}
              - {label: "Ancien prix (FCFA, optionnel)", name: "ancienPrix", widget: "number", value_type: "int", required: false}
              - {label: "Lien de paiement (Chariow)", name: "lienPaiement", widget: "string"}
